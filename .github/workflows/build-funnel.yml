name: 🔻 Build Funnel

# Workflow UNIQUE du funnel :
#  - funnel.json    : à chaque run (Secteur › Chaîne › Région › Action + panels multi-axes)
#  - funnel_news.json : HEBDO (lundi) ou sur déclenchement manuel — news réelles classées (codebook)
# La page funnel.html LIT ces JSON (fetch même-origine) — aucun appel API en direct depuis le navigateur.

on:
  workflow_dispatch:
    inputs:
      news:
        description: 'Régénérer aussi les news (funnel_news.json)'
        type: boolean
        default: true
  schedule:
    # après les mises à jour stocks du matin (Paris ~08:30 été / 09:30 hiver)
    - cron: '30 6 * * 1-5'
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: build-funnel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 💧 Hydrater roic+quality depuis le snapshot (anti-kill 6h)
        # La passe fondamentaux (filter-stocks) se fait tuer à 6h → stocks_*.json sortent avec
        # roic ET quality null → gate solidité KO. On re-hydrate depuis le dernier état SAIN
        # (fundamentals_snapshot.json), qui se rafraîchit tout seul quand un run réussit.
        run: python3 scripts/hydrate_fundamentals.py

      - name: 🔻 Générer funnel.json
        run: python3 scripts/build_funnel.py

      - name: 📰 Générer funnel_news.json (hebdo lundi, ou manuel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # News = contexte, pas signal → cadence hebdo. On la régénère le LUNDI (cron)
          # ou sur déclenchement manuel avec l'input news=true.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.news }}" = "true" ] && python3 scripts/build_news.py || echo "ℹ️ news désactivées (input)"
          elif [ "$(date -u +%u)" = "1" ]; then
            python3 scripts/build_news.py
          else
            echo "ℹ️ news : hebdo (lundi) — skip aujourd'hui"
          fi

      - name: 💾 Commit et push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NB : on NE committe PAS les stocks_*.json (gros fichiers, écrits par le scoring en
          # concurrent → un rebase-merge JSON les corromprait). L'hydratation les modifie en
          # mémoire pour bâtir funnel.json ; c'est funnel.json (+ snapshot) qu'on persiste.
          git add data/funnel.json data/funnel_news.json data/fundamentals_snapshot.json 2>/dev/null || true
          # L'hydratation a modifié les stocks_*.json sur le disque (utilisés en mémoire pour bâtir
          # funnel.json). On ne les persiste pas → on JETTE ces modifs non-stagées, sinon `git rebase`
          # refuse (« cannot rebase: You have unstaged changes »).
          git checkout -- data/stocks_us.json data/stocks_europe.json data/stocks_asia.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ rien de changé, rien à committer"; exit 0
          fi
          git commit -m "🔻 Build Funnel - $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # push robuste : boucle fetch→rebase→push (résiste aux pushes concurrents)
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X ours origin/main; then
              if git push origin HEAD:main; then echo "✅ Push OK (essai $i)"; exit 0; fi
            else
              git rebase --abort || true
            fi
            echo "↻ retry $i…"; sleep $((i * 3))
          done
          echo "❌ push échoué après 5 essais"; exit 1
