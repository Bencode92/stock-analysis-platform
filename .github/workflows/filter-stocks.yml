name: 📊 Filter Stocks by Volume

# ═══════════════════════════════════════════════════════════════════════════════
# GÈRE: Filtrage par volume (tous marchés) + enrichissement fondamentaux
# SCRIPT: scripts/stock-filter-by-volume.js
# HORAIRE: 04:00 Paris (nuit, après clôture US)
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Région à traiter'
        required: true
        type: choice
        options: [all, us, europe, asia]
        default: 'all'
      skip_volume:
        description: 'ROIC seul (sauter le scan volume ~6h). Décoche pour un scan volume complet.'
        type: boolean
        default: true
      debug:
        description: 'Enable debug mode'
        required: false
        default: '0'

  schedule:
    # ═══════════════════════════════════════════════════════════════════════════
    # 🗓️ WEEK-END SEULEMENT — les fondamentaux (ROIC = métrique 3 ans) ne bougent pas
    # en semaine ; les gros runs quotidiens étaient du gaspillage (et se faisaient tuer à 6h).
    # Passes bornées (MAX_FUNDAMENTALS_FETCH) qui écrivent toujours le CSV et rafraîchissent
    # la tranche périmée en rotation (TTL 30j). 4 passes Sam+Dim couvrent tout l'univers.
    # ═══════════════════════════════════════════════════════════════════════════
    - cron: '0 2 * * 6'    # Samedi 02:00 UTC
    - cron: '0 12 * * 6'   # Samedi 12:00 UTC
    - cron: '0 2 * * 0'    # Dimanche 02:00 UTC
    - cron: '0 12 * * 0'   # Dimanche 12:00 UTC

concurrency:
  # groupe dédié (plus repo-writes-global partagé) → ne se fait plus annuler par les autres workflows
  group: filter-stocks
  cancel-in-progress: false

permissions:
  contents: write

env:
  TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Gate - fenêtre élargie ±20min pour absorber délais GitHub
  # ═══════════════════════════════════════════════════════════════════════════
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      regions: ${{ steps.detect.outputs.regions }}

    steps:
      - name: 🕐 Detect if we should run
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "regions=${{ inputs.region }}" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger: region=${{ inputs.region }}"
          else
            echo "regions=all" >> $GITHUB_OUTPUT
            echo "✅ Schedule trigger (cron: ${{ github.event.schedule }})"
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Filter by Volume
  # ═══════════════════════════════════════════════════════════════════════════
  filter-stocks:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install csv-parse axios

      - name: 📊 Run Stock Filter by Volume
        env:
          DEBUG: ${{ inputs.debug || '0' }}
          DATA_DIR: data
          OUTPUT_DIR: data/filtered
          REGIONS: ${{ needs.gate.outputs.regions }}
          # WEEK-END (schedule) → SKIP_VOLUME : on saute le scan volume (fetch de 11k cotations
          # 1-par-1 = 6h, jamais fini) et on repart de l'univers déjà filtré pour n'enrichir que le
          # ROIC. L'appartenance à l'univers est stable → le scan volume complet se lance à la main
          # (workflow_dispatch, skip_volume décoché) quand il faut rafraîchir l'univers.
          SKIP_VOLUME: ${{ (github.event_name == 'schedule' || inputs.skip_volume) && '1' || '0' }}
          # Run BORNÉ : ≤1500 nouveaux fetchs fondamentaux/passe → finit en ~1-2h. Le reste de la
          # tranche périmée (TTL 30j) est couvert par les passes suivantes du week-end (rotation).
          MAX_FUNDAMENTALS_FETCH: '1500'
          CACHE_TTL_DAYS: '30'
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "📊 Running stock-filter-by-volume.js"
          echo "🌍 REGIONS=$REGIONS"
          echo "══════════════════════════════════════════════════════════════"

          node scripts/stock-filter-by-volume.js

      - name: Upload filtered data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-stocks-${{ github.run_number }}
          path: data/filtered/**
          retention-days: 7

      - name: 📋 Summary
        if: always()
        run: |
          echo "📂 Filtered files:"
          ls -lh data/filtered/*.csv 2>/dev/null || echo "No CSV files"

          echo ""
          echo "📈 Counts:"
          for f in data/filtered/*_filtered.csv; do
            if [ -f "$f" ]; then
              COUNT=$(tail -n +2 "$f" | wc -l)
              echo "  $(basename $f): $COUNT stocks"
            fi
          done

          # GitHub Summary
          REGIONS="${{ needs.gate.outputs.regions }}"
          echo "## 📊 Volume Filter Results (REGIONS=$REGIONS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f data/filtered/Actions_US_filtered.csv ]; then
            US_COUNT=$(tail -n +2 data/filtered/Actions_US_filtered.csv | wc -l)
            echo "- 🇺🇸 US: **$US_COUNT** stocks" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f data/filtered/Actions_Europe_filtered.csv ]; then
            EU_COUNT=$(tail -n +2 data/filtered/Actions_Europe_filtered.csv | wc -l)
            echo "- 🇪🇺 Europe: **$EU_COUNT** stocks" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f data/filtered/Actions_Asie_filtered.csv ]; then
            ASIA_COUNT=$(tail -n +2 data/filtered/Actions_Asie_filtered.csv | wc -l)
            echo "- 🌏 Asia: **$ASIA_COUNT** stocks" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Commit and push
        if: always()
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

          git add data/filtered/*.csv 2>/dev/null || true
          git add data/fundamentals_cache.json 2>/dev/null || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️ Nothing to commit"
            exit 0
          fi

          REGIONS="${{ needs.gate.outputs.regions }}"
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "📊 Volume Filter [$REGIONS] - $TS [skip ci]"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git fetch origin && git rebase -X theirs "origin/$BRANCH" || git rebase --abort || true
            git push origin "HEAD:$BRANCH" && echo "✅ Push OK" && exit 0
            sleep $((RANDOM%5+2))
          done
          exit 1

