name: Aperçu de la prochaine vague (socle, conviction)

# Lecture seule : relit les fichiers déjà collectés, sans appel d'API ni effet sur les portefeuilles.
# Séparé du moteur des portefeuilles : l'aperçu reste à jour même quand le moteur échoue.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_wave_preview.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wave_preview.json data/conviction_universe.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(preview): aperçu de vague [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
